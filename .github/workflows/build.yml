name: Build

# develop builds X.Y.Z-dev.N, release X.Y.Z-pre.N and main the release X.Y.Z, which the release job
# tags and publishes with the package (see CONTRIBUTING.md of datazuul/amadeos, "Commits and versions").
on:
  push:
    branches: [develop, release, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is computed from the history since the last release tag.
          fetch-depth: 0
      - id: version
        uses: amadeos-eu/amadeos-ci/version@main
        with:
          metainfo: packaging/eu.amadeos.apps.tv.metainfo.xml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Plain actions/cache instead of the proprietary enhanced cache that is the v6 default.
          cache-provider: basic
      # The Swing page tests need a display, so run under Xvfb; nothing needs libmpv or the network.
      - name: Test
        run: xvfb-run --auto-servernum ./gradlew test --no-daemon
      - name: Check that the tests ran
        run: |
          count=$(grep -ho 'tests="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          skipped=$(grep -ho 'skipped="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "Tests run: $count, skipped: $skipped"
          test "$count" -ge 50
          test "$skipped" -eq 0
      - name: Package
        run: ./gradlew jar deb --no-daemon -PappVersion=${{ steps.version.outputs.version }}
      - name: Check the fat jar and the package
        run: |
          jar=$(ls build/libs/amade-tv-*.jar)
          unzip -l "$jar" | grep -q 'com/sun/jna/Native.class'
          unzip -p "$jar" META-INF/services/org.slf4j.spi.SLF4JServiceProvider | grep -q logback
          dpkg-deb --info build/distributions/amade-tv_*_all.deb | grep -q 'Depends:.*libmpv2'
          dpkg-deb --contents build/distributions/amade-tv_*_all.deb | grep -q usr/share/applications/amade-tv.desktop
          dpkg-deb --contents build/distributions/amade-tv_*_all.deb | grep -q usr/bin/amade-tv
      - name: Check the package version
        run: |
          deb=$(ls build/distributions/amade-tv_*_all.deb)
          test "$(dpkg-deb --field "$deb" Version)" = "${{ steps.version.outputs.deb-version }}"
      - name: Upload the Debian package
        uses: actions/upload-artifact@v7
        with:
          name: amade-tv-deb
          path: build/distributions/*.deb
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test

  # Only on main, after the release branch was promoted: tag vX.Y.Z and publish the GitHub Release.
  release:
    needs: test
    if: needs.test.outputs.channel == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: amade-tv-deb
          path: dist
      - uses: amadeos-eu/amadeos-ci/release@main
        with:
          version: ${{ needs.test.outputs.version }}
          files: dist/*.deb

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: amadeos-eu/amadeos-ci/check-commits@main
